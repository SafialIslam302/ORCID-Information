name: Python CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v2

    # Step 2: Set up Python
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.8'  # You can specify your preferred version of Python

    # Step 3: Run linter (flake8)
    - name: Run linter
      run: |
        pip install flake8
        flake8 .  # You can configure flake8 to check your code style

    # Step 4: Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Step 5: Run your Python script (main.py or any other script)
    - name: Run Python Script
      run: |
        python src/main.py  # Replace with the actual script name you want to run

    # Step 6: Run tests
    - name: Run tests
      run: |
        pytest --maxfail=1 --disable-warnings -q

    # Step 7: Generate test coverage report (optional)
    - name: Run test coverage
      run: |
        pip install coverage
        coverage run -m pytest
        coverage report
        coverage html  # Generates an HTML report
